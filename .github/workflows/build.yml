name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret – the APK will be debug-signed."
          fi

      - name: Build the Android app
        working-directory: android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/Wallpapers.apk

      - name: Build the Linux package
        run: |
          VERSION=$(grep -oP '^Version: \K.+' linux/DEBIAN/control)
          mkdir -p /tmp/pkg && cp -r linux/DEBIAN linux/usr /tmp/pkg/
          chmod 755 /tmp/pkg/DEBIAN/postinst /tmp/pkg/usr/bin/jonsolberg-wallpapers /tmp/pkg/usr/share/jonsolberg-wallpapers/wallpapers.py
          echo "Installed-Size: $(du -sk /tmp/pkg/usr | cut -f1)" >> /tmp/pkg/DEBIAN/control
          dpkg-deb --root-owner-group -b /tmp/pkg "out/jonsolberg-wallpapers_${VERSION}_all.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: wallpapers
          path: out/

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          DEB=$(grep -oP '^Version: \K.+' linux/DEBIAN/control)
          TAG="android-$APK-linux-$DEB"
          cp out/Wallpapers.apk "out/Wallpapers-$APK.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" \
              --title "Wallpapers – Android $APK, Linux $DEB" --notes "Built from ${GITHUB_SHA::7}." --latest
          fi
